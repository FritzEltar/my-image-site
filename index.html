<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <meta name="description"
          content="我的个人图片素材库">

    <title>My Image Library</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- 顶部导航 -->
    <header class="header">

        <div class="header-inner">

            <a href="#" id="homeLink" class="logo">
                My Image Library
            </a>

            <nav>
                <button id="darkModeBtn"
                        class="dark-mode-btn"
                        title="切换深色模式">
                    🌙
                </button>
            </nav>

        </div>

    </header>


    <main class="container">

        <!-- 面包屑：大类 / 图集 -->
        <nav id="breadcrumb"
             class="breadcrumb"
             aria-label="位置导航">
        </nav>


        <!-- 视图 1：大类列表（只有一个大类时会自动进入，不显示这一层） -->
        <section id="groupsView"
                 class="view"
                 style="display:none;">

            <div id="groupsGrid"
                 class="cover-grid">
            </div>

        </section>


        <!-- 视图 2：某个大类下的图集封面列表 -->
        <section id="collectionsView"
                 class="view"
                 style="display:none;">

            <div id="collectionsGrid"
                 class="cover-grid">
            </div>

        </section>


        <!-- 视图 3：图集内部（角色页签 + 图片） -->
        <section id="imagesView"
                 class="view"
                 style="display:none;">

            <!-- 角色页签：只有图集里真实存在的角色，没有「全部」 -->
            <section id="roleSection"
                     class="role-section">
            </section>


            <section class="search-section">

                <input
                    type="text"
                    id="searchInput"
                    placeholder="在本图集内搜索标题、标签..."
                    autocomplete="off"
                >

            </section>


            <div class="result-info">

                <span id="resultCount">
                </span>

            </div>


            <section
                id="gallery"
                class="gallery">
            </section>


            <section
                id="imagesEmpty"
                class="empty-message"
                style="display:none;">

                <div class="empty-icon">
                    🔍
                </div>

                <h2 id="imagesEmptyTitle">
                    没有找到图片
                </h2>

                <p id="imagesEmptyText">
                    尝试搜索其他关键词
                </p>

            </section>


            <section
                id="pagination"
                class="pagination"
                style="display:none;">

                <button
                    id="prevBtn"
                    class="page-btn">
                    ← 上一页
                </button>

                <span id="pageInfo">
                    第 1 页
                </span>

                <button
                    id="nextBtn"
                    class="page-btn">
                    下一页 →
                </button>

            </section>

        </section>


        <!-- 全局状态：图库为空 / 清单加载失败 -->
        <section
            id="statusMessage"
            class="empty-message"
            style="display:none;">

            <div id="statusIcon" class="empty-icon">
                🖼️
            </div>

            <h2 id="statusTitle">
            </h2>

            <p id="statusText">
            </p>

        </section>

    </main>


    <!-- 图片查看器 -->
    <div
        id="imageModal"
        class="modal">

        <div class="modal-content">

            <button
                id="closeModal"
                class="close-btn">
                ×
            </button>

            <img
                id="modalImage"
                src=""
                alt=""
            >

            <div class="modal-info">

                <h2 id="modalTitle">
                    图片名称
                </h2>

                <p id="modalDescription">
                </p>

                <div class="modal-buttons">

                    <button
                        id="copyUrlBtn"
                        class="modal-btn">
                        🔗 复制图片 URL
                    </button>

                    <a
                        id="downloadBtn"
                        class="modal-btn"
                        href="#"
                        download>
                        ⬇️ 下载图片
                    </a>

                </div>

            </div>

        </div>

    </div>


    <!-- 页脚 -->
    <footer class="footer">

        <p>
            © 2026 My Image Library
        </p>

        <p>
            Powered by GitHub Pages
        </p>

    </footer>


    <noscript>
        <p style="text-align:center;padding:20px;">
            这个图库需要开启 JavaScript 才能显示图片。
        </p>
    </noscript>

    <script src="script.js"></script>

</body>

</html>
